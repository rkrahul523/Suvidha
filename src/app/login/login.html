

<div class="container">
  <div class="login-card">
    <div class="header">
      <div class="logo">🚀</div>
      <h1 class="title">E Suvidha</h1>
      <p class="subtitle">Welcome to seamless leave management</p>
    </div>

    <div class="tabs">
      <!-- <div class="tab" [class.active]="activeTab() === 'timetable'" >
        📅 Time-table
      </div> -->
      <div class="tab" [class.active]="activeTab() === 'login'" (click)="setTab('login')">
        🔐 Login
      </div>
    </div>

    <div class="tab-content">
      @if (activeTab() === 'login') {
        <form (ngSubmit)="onLogin()" #loginForm="ngForm">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input
              type="text"
              class="form-input"
              [(ngModel)]="username"
              name="username"
              required
              placeholder="Enter your Username"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input
              type="password"
              class="form-input"
              [(ngModel)]="password"
              name="password"
              required
              minlength="6"
              placeholder="Enter your password"
            />
          </div>
          <div class="login-button d-block">
            <button type="submit" class="login-btn" [disabled]="!loginForm.valid">
              Sign In
              <span
                class="spinner-border text-primary loading-spinner"
                role="status"
                *ngIf="loaderFlag()"
              >
                <span class="sr-only"></span>
              </span>
            </button>
          </div>
        </form>
        <div style="text-align: center; margin-top: 1.5rem; color: #64748b">
          <small>Don't have an account? <a href="#" style="color: #4facfe">Sign up</a></small>
        </div>
      }
    </div>
  </div>
</div>

<!-- Fullscreen Timetable Overlay -->
@if (activeTab() === 'timetable') {
  <div class="timetable-fullscreen" [@slideInFull]>
    <button class="back-btn" (click)="setTab('login')">← Back</button>
