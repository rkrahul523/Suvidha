
    <div class="main-tabs-container">
      <!-- Main Tab Navigation -->
      <ul class="nav nav-tabs main-nav-tabs mb-4">
        <li class="nav-item">
          <button 
            class="nav-link" 
            [class.active]="activeTab() === 'login'"
            (click)="setActiveTab('login')"
            type="button">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login
          </button>
        </li>
        <li class="nav-item">
          <button 
            class="nav-link" 
            [class.active]="activeTab() === 'Dashtimetable'"
            (click)="setActiveTab('Dashtimetable')"
            type="button">
            <i class="bi bi-calendar3 me-2"></i>DASH Timetable
          </button>
        </li>
        <li class="nav-item">
          <button 
            class="nav-link" 
            [class.active]="activeTab() === 'FFTtimetable'"
            (click)="setActiveTab('FFTtimetable')"
            type="button">
            <i class="bi bi-calendar3 me-2"></i>FFT Timetable
          </button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content main-tab-content">
        <!-- Login Tab -->
        <div 
          class="tab-pane fade show" 
          [class.active]="activeTab() === 'login'">
          <app-login></app-login>
        </div>
        
        <!-- Timetable Tab -->
        <div 
          class="tab-pane fade show" 
          [class.active]="activeTab() === 'Dashtimetable'">
          <app-dash-time-table></app-dash-time-table>
        </div>
        <div 
          class="tab-pane fade show" 
          [class.active]="activeTab() === 'FFTtimetable'">
          <app-fft-time-table></app-fft-time-table>
        </div>
      </div>
    </div>
