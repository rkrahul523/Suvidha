
    <div class="calendar-card h-100">
      <div class="calendar-header px-4 py-3">
        <div class="d-flex justify-content-between align-items-center">
          <h6 class="mb-0 fw-bold text-white d-flex align-items-center">
            <i class="bi bi-calendar3-week me-2"></i>December 2025
          </h6>
          <div class="calendar-nav">
            <button class="btn-nav prev" (click)="prevMonth()">
              <i class="bi bi-chevron-left"></i>
            </button>
            <button class="btn-nav next" (click)="nextMonth()">
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>
      
      <div class="calendar-body p-3 p-md-4">
        <!-- Weekdays -->
        <div class="weekdays row g-2 mb-3 text-center">
          <div class="col day-header">Sun</div>
          <div class="col day-header">Mon</div>
          <div class="col day-header">Tue</div>
          <div class="col day-header">Wed</div>
          <div class="col day-header">Thu</div>
          <div class="col day-header">Fri</div>
          <div class="col day-header">Sat</div>
        </div>
        
        <!-- Days Grid -->
        <div class="days-container">
          @for (week of weeks(); track $index) {
            <div class="week row g-2">
              @for (day of week; track day.date + '-' + $parent.$index) {
                <div class="col day-cell position-relative p-1 p-md-2"
                     [ngClass]="{
                       'today': day.isToday,
                       'has-leave': day.leaves > 0 && !day.isEmpty,
                       'selectable': !day.isEmpty,
                       'empty': day.isEmpty
                     }"
                     (click)="selectDay(day)">
                  
                  @if (!day.isEmpty) {
                    <div class="day-number">{{ day.date }}</div>
                    @for (type of day.leaveTypes; track type; let last = $last) {
                      <div class="leave-indicator" 
                           [ngClass]="'type-' + type.toLowerCase() + (last ? '' : ' me-1')">
                      </div>
                    }
                  }
                </div>
              }
            </div>
          }
        </div>
      </div>
    </div>
