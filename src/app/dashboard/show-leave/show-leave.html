
    <div class="today-container position-relative mb-5">
      <h4 class="mb-4 fw-bold text-dark d-flex align-items-center justify-content-between">
        <span>Upcoming Leave</span>
        <span class="badge bg-success fs-6">{{ employees().length }} People</span>
      </h4>
      
      <div #scrollContainer class="today-scroll-row" (scroll)="onScroll()">
        @for (emp of employees(); track emp.leaveId; let i = $index) {
          <div class="today-card-wrapper mx-2 flex-shrink-0">
            <div class="card h-100 today-card p-4 text-center position-relative overflow-hidden"
                 [ngClass]="getCardClass(emp.type)"
                 >
              <div class="card-icon mb-3">{{ getIcon(emp.type) }}</div>
              <h6 class="mb-2 fw-bold">{{ emp.employee }}</h6>
              <div class="badge w-100 py-2 mb-2 fs-6 fw-semibold">{{ emp.type }}</div>
              <small class="date-text text-dark fw-medium">{{ emp.fromDate }}- {{ emp.toDate }} </small>
            </div>
          </div>
        }
      </div>

      
      <button class="scroll-btn scroll-left" [class.active]="showLeftArrow" (click)="scrollLeft()">
        <i class="bi bi-chevron-left"></i>
      </button>
      <button class="scroll-btn scroll-right" [class.active]="showRightArrow" (click)="scrollRight()">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>
